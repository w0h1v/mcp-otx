[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otx-mcp"
version = "1.1.0"
description = "MCP server for AlienVault OTX / LevelBlue Open Threat Exchange threat intelligence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "orie" }]
keywords = ["mcp", "otx", "alienvault", "levelblue", "threat-intelligence", "dfir"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.2.0,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
otx-mcp = "otx_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/otx_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
