[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otx-mcp"
dynamic = ["version"]
description = "MCP server for AlienVault OTX / LevelBlue Open Threat Exchange threat intelligence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "w0h1v" }]
keywords = ["mcp", "otx", "alienvault", "levelblue", "threat-intelligence", "dfir", "mcp-server", "model-context-protocol", "osint", "claude"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://w0h1v.github.io/mcp-otx/"
Documentation = "https://w0h1v.github.io/mcp-otx/"
Repository = "https://github.com/w0h1v/mcp-otx"
Issues = "https://github.com/w0h1v/mcp-otx/issues"
Changelog = "https://github.com/w0h1v/mcp-otx/blob/main/CHANGELOG.md"

[project.scripts]
otx-mcp = "otx_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.version]
path = "src/otx_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["__pycache__", "*.pyc", ".pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["src/otx_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
