name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing (OIDC)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Read the package version
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/otx_mcp/__init__.py)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::Release tag ${TAG} does not match package version ${VERSION}"
            exit 1
          fi

      - run: uv venv
      - run: uv pip install ".[dev]"
      - run: uv run --no-sync pytest
      - run: uv build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    name: Publish to the MCP Registry
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # MCP Registry GitHub OIDC login
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # The registry rejects re-publishing a version; the namespace
      # io.github.w0h1v/* is authorized by this repo's OIDC token.
      - name: Set server.json version
        env:
          VERSION: ${{ needs.pypi.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # PyPI can take a moment to show a new release; retry until it does.
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Publish attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          echo "::error::MCP Registry publish failed after 5 attempts"
          exit 1
