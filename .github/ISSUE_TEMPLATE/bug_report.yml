name: Bug report
description: Report a defect in mcp-otx
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, bearer tokens or indicators from private investigations. Use public, well-known indicators in reproductions (for example 8.8.8.8 or the EICAR test file hash).

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the exact error text.
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Tool call
      description: 'The tool and arguments you used, for example get_indicator_details with {"indicator_type": "IPv4", "indicator_value": "8.8.8.8", "section": "reputation"}.'
      render: json

  - type: input
    id: version
    attributes:
      label: mcp-otx version
      description: Output of `pip show otx-mcp` (or `uv pip show otx-mcp`), or the commit you built from.
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      description: For example, Python 3.12 on macOS 15 arm64.
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client, transport and mode
      description: For example, Claude Desktop over stdio, read-only (default).
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included API keys, bearer tokens or indicators from private investigations.
          required: true
